name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir --parents _site
          cp index.html _site/index.html
          cp Nexo.html _site/Nexo.html
          cp .nojekyll _site/.nojekyll

      - name: Assemble solder inspection app
        run: |
          cp -R inspeccion _site/inspeccion
          # el modelo ONNX y los binarios de ONNX Runtime se publican tal cual
          test -f _site/inspeccion/modelos/nexo-solder.onnx
          test -f _site/inspeccion/vendor/ort-wasm-simd-threaded.wasm
          du -sh _site/inspeccion

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
